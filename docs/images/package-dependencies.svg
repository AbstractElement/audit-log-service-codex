<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Audit Log Service package dependencies</title>
  <desc id="desc">Diagram showing API depending on application, application depending on domain, and infrastructure implementing application ports while using domain and PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .domain { fill: #ecfdf5; stroke: #047857; }
      .app { fill: #eff6ff; stroke: #2563eb; }
      .infra { fill: #fff7ed; stroke: #c2410c; }
      .api { fill: #fdf2f8; stroke: #be185d; }
      .db { fill: #f1f5f9; stroke: #475569; }
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .line { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .note { fill: #fefce8; stroke: #a16207; stroke-width: 1.5; rx: 6; }
      .noteText { font: 13px Arial, sans-serif; fill: #713f12; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="560" />
  <text class="title" x="40" y="48">Package Dependencies</text>
  <text class="text" x="40" y="75">Dependencies point inward toward domain and application ports.</text>

  <rect class="box api" x="395" y="105" width="190" height="82" />
  <text class="label" x="426" y="138">api</text>
  <text class="text" x="422" y="162">REST controllers</text>

  <rect class="box app" x="360" y="250" width="260" height="92" />
  <text class="label" x="407" y="284">application</text>
  <text class="text" x="393" y="309">Use cases, commands, ports</text>

  <rect class="box domain" x="80" y="398" width="260" height="92" />
  <text class="label" x="173" y="432">domain</text>
  <text class="text" x="117" y="457">AuditEvent and business rules</text>

  <rect class="box infra" x="640" y="398" width="260" height="92" />
  <text class="label" x="708" y="432">infrastructure</text>
  <text class="text" x="674" y="457">JPA adapter, config, Flyway</text>

  <path class="db" d="M 690 120 C 690 98, 850 98, 850 120 L 850 182 C 850 204, 690 204, 690 182 Z" />
  <ellipse class="db" cx="770" cy="120" rx="80" ry="22" />
  <text class="label" x="724" y="151">PostgreSQL</text>
  <text class="text" x="715" y="174">audit_events</text>

  <path class="line" d="M 490 187 L 490 250" />
  <text class="text" x="505" y="224">calls use cases</text>

  <path class="line" d="M 360 312 C 260 335, 215 360, 210 398" />
  <text class="text" x="225" y="347">creates domain model</text>

  <path class="line" d="M 640 420 C 585 365, 575 340, 580 325" />
  <text class="text" x="610" y="370">implements ports</text>

  <path class="line" d="M 640 452 C 522 486, 420 487, 340 455" />
  <text class="text" x="450" y="506">maps persistence entities</text>

  <path class="line" d="M 770 398 L 770 204" />
  <text class="text" x="790" y="306">JPA and Flyway</text>

  <rect class="note" x="64" y="270" width="230" height="78" />
  <text class="noteText" x="84" y="300">Domain has no Spring,</text>
  <text class="noteText" x="84" y="322">JPA, Hibernate, or API</text>
  <text class="noteText" x="84" y="344">dependencies.</text>

  <rect class="note" x="670" y="268" width="250" height="58" />
  <text class="noteText" x="690" y="298">Infrastructure depends inward</text>
  <text class="noteText" x="690" y="320">and implements application ports.</text>
</svg>
